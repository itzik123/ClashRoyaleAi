# NOT a package definition any more.
#
# This file arrived with the vendored ClashRoyaleBuildABot and declared it as an
# installable distribution. Nothing installs it: `tests/conftest.py` puts
# perception/ on `sys.path` directly ("without the package needing to be
# installed"), and perception/.venv contains no install of it. The
# `[build-system]` and `[project]` tables were therefore stripped in the
# 2026-08-24 cleanup -- they were not merely unused but actively WRONG:
#
#   requires-python = "==3.12.*"   we run 3.11; the engine .pyd has no other ABI
#   opencv-python                  contradicts requirements.txt's DELIBERATE
#                                  choice of opencv-python-headless
#   name = "ClashRoyaleBuildABot"  this tree is a sensor inside another project
#   flatbuffers/protobuf/rich/     zero importers in the surviving tree
#   pybind11/requests/av/tqdm
#   pyqt6/keyboard                 removed with upstream's GUI and Bot loop
#
# **perception/requirements.txt is the source of truth for dependencies.**
#
# What survives here is the ruff configuration, which IS used -- the `# noqa:
# E402` and `# noqa: PLC0415` suppressions throughout this tree are ruff rule
# codes -- and has no other home.

[tool.ruff]
line-length = 79
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "E231", "E222"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
