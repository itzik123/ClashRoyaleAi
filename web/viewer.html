<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clash Royale Env — Game Replay Viewer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    /* Chrome is strictly greyscale. The ONLY colour outside the arena is
       team identity (blue/red) and the two status accents below, both of
       which carry meaning rather than decoration. */
    --bg-primary: #0B0B0C;
    --bg-secondary: #101012;
    --bg-panel: #141416;
    --bg-card: #1C1C1F;
    --bg-hover: #26262A;
    --border: #26262A;
    --text-primary: #F5F5F5;
    --text-secondary: #A1A1A6;
    --text-muted: #6E6E73;
    --blue-team: #4a9eff;
    --blue-team-dim: #2a5a99;
    --red-team: #ff5252;
    --red-team-dim: #992a2a;
    --accent-green: #4ade80;
    --accent-yellow: #facc15;
    /* Arena palette, matched to the real game: one continuous lawn with a
       two-tone mown checker, a cyan river, wood bridges and tan lane paths.
       Deliberately the ONLY saturated colour on the page -- the chrome around
       it is greyscale, so the board is what the eye goes to. */
    --grass-light: #93C756;
    --grass-dark: #84BC46;
    --river: #37BEDC;
    --river-edge: #2AA5C2;
    --bridge-deck: #B4813F;
    --bridge-seam: #8A5F2B;
    --lane-path: #CFC08F;
    --arena-surround: #2E4A1C;
    --badge-ground: #C9C9CE;
    --badge-air: #8E8E93;
    --badge-building: #6E6E73;
    --badge-spell: #B9B9C0;
  }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 20px;
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    height: 52px;
  }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .header h1 {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.2px;
    color: var(--text-primary);
  }
  .header .badge {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
    background: var(--bg-card);
    color: var(--text-secondary);
    border: 1px solid var(--border);
  }
  .header .result-badge {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    display: none;
  }
  .header .result-badge.show { display: inline-block; }
  .header .result-badge.win-blue { color: var(--blue-team); border-color: var(--blue-team-dim); background: rgba(74,158,255,0.1); }
  .header .result-badge.win-red { color: var(--red-team); border-color: var(--red-team-dim); background: rgba(255,82,82,0.1); }
  .header .result-badge.draw { color: var(--accent-yellow); background: rgba(250,204,21,0.08); }

  /* Main layout */
  .main-layout {
    display: flex;
    flex: 1;
    overflow: hidden;
    min-height: 0;
  }

  /* Canvas area */
  .arena-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
    min-width: 0;
    min-height: 0;
  }
  .arena-row {
    display: flex;
    align-items: center;
    gap: 20px;
    max-width: 100%;
    max-height: 100%;
  }
  .gauge-panel {
    width: 200px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .gauge-title {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--text-muted);
  }
  .gauge-value {
    font-size: 22px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    margin-top: -10px;
  }
  .gauge-action {
    font-size: 12px;
    color: var(--text-secondary);
    text-align: center;
    line-height: 1.4;
  }
  .gauge-action strong { color: var(--text-primary); }
  .canvas-wrapper {
    position: relative;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4), inset 0 0 0 1px var(--border);
    max-height: 100%;
    max-width: 100%;
    display: flex;
  }
  canvas {
    display: block;
    cursor: crosshair;
    max-height: 100%;
    max-width: 100%;
    object-fit: contain;
  }

  /* Controls bar */
  .controls {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 20px;
    background: var(--bg-secondary);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  .controls button {
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text-primary);
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
    transition: background 0.15s;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .controls button:hover { background: var(--bg-hover); }
  .controls button.active {
    background: var(--blue-team);
    border-color: var(--blue-team);
    color: #fff;
  }
  .scrubber-container { flex: 1; display: flex; align-items: center; gap: 8px; }
  .scrubber {
    flex: 1;
    -webkit-appearance: none;
    height: 6px;
    border-radius: 3px;
    background: var(--bg-card);
    outline: none;
  }
  .scrubber::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--blue-team);
    cursor: pointer;
    box-shadow: 0 0 8px rgba(74, 158, 255, 0.4);
  }
  .tick-display {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    min-width: 100px;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }
  .speed-label {
    font-size: 12px;
    color: var(--text-muted);
  }
  .speed-select {
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text-primary);
    padding: 4px 8px;
    border-radius: 4px;
    font-family: inherit;
    font-size: 12px;
  }

  /* Sidebar */
  .sidebar {
    width: 300px;
    background: var(--bg-secondary);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    flex-shrink: 0;
  }
  .panel {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
  }
  .panel-title {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--text-muted);
    margin-bottom: 10px;
  }

  /* Panel primitives, on an 8px scale ---------------------------------- */
  .stat-row {
    display: grid;
    grid-template-columns: 38px 1fr 40px;
    align-items: center;
    gap: 8px;
    height: 24px;
  }
  .stat-key {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.6px;
  }
  .stat-num {
    font-size: 13px;
    font-weight: 600;
    text-align: right;
    font-variant-numeric: tabular-nums;
    color: var(--text-primary);
  }
  .meter {
    height: 6px;
    background: var(--bg-card);
    border-radius: 3px;
    overflow: hidden;
  }
  .meter-fill {
    height: 100%;
    border-radius: 3px;
    background: var(--text-primary);
    transition: width 0.12s linear;
  }

  /* Hands */
  .hand-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-bottom: 10px;
  }
  .card-tile {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 8px;
    font-size: 11px;
    min-width: 0;
  }
  .card-tile .nm {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--text-primary);
  }
  .card-tile .cost {
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--text-secondary);
    flex-shrink: 0;
  }
  /* Dimmed when the card costs more than that side's current elixir. */
  .card-tile.unaffordable { opacity: 0.34; }
  .hand-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.6px;
    margin-bottom: 6px;
  }
  .empty-note {
    font-size: 11px;
    color: var(--text-muted);
    font-style: italic;
  }

  /* Tower HP */
  .tower-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }
  .tower-card {
    background: var(--bg-primary);
    border-radius: 6px;
    padding: 8px 10px;
    border: 1px solid var(--border);
  }
  .tower-card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 4px;
  }
  .tower-name {
    font-size: 11px;
    font-weight: 500;
    color: var(--text-secondary);
  }
  .tower-hp-num {
    font-size: 12px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .tower-card.destroyed { opacity: 0.45; }

  /* Entity inspector */
  .inspector-empty {
    font-size: 12px;
    color: var(--text-muted);
    font-style: italic;
  }
  .inspector-detail {
    font-size: 12px;
    margin-bottom: 4px;
  }
  .inspector-detail span {
    color: var(--text-secondary);
  }
  .inspector-detail strong {
    color: var(--text-primary);
  }
  .inspector-note {
    margin-top: 8px;
    font-size: 10px;
    color: var(--text-muted);
    font-style: italic;
    line-height: 1.4;
  }

  /* Event log */
  .event-log {
    flex: 1;
    overflow-y: auto;
    min-height: 100px;
  }
  .event-log-inner {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .event {
    font-size: 11px;
    padding: 3px 6px;
    border-radius: 4px;
    background: var(--bg-primary);
    line-height: 1.4;
  }
  .event-spawn { border-left: 2px solid var(--accent-green); }
  .event-death { border-left: 2px solid var(--red-team); }
  .event-tick {
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
    margin-right: 4px;
  }

  /* Drop zone overlay */
  .drop-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 17, 23, 0.92);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  .drop-overlay.hidden { display: none; }
  .drop-box {
    border: 2px dashed var(--border);
    border-radius: 16px;
    padding: 60px 80px;
    text-align: center;
    transition: border-color 0.2s;
  }
  .drop-box.drag-over { border-color: var(--blue-team); }
  .drop-icon { font-size: 48px; margin-bottom: 16px; }
  .drop-title { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
  .drop-subtitle { font-size: 14px; color: var(--text-secondary); margin-bottom: 20px; }
  .file-input-btn {
    background: var(--text-secondary);
    border: none;
    color: #fff;
    padding: 10px 24px;
    border-radius: 8px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .file-input-btn:hover { opacity: 0.9; }
  #fileInput { display: none; }

  /* Tooltip */
  .tooltip {
    position: absolute;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 12px;
    pointer-events: none;
    z-index: 50;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    display: none;
  }
  .tooltip-name {
    font-weight: 600;
    margin-bottom: 2px;
  }
  .tooltip-stat {
    color: var(--text-secondary);
    font-size: 11px;
  }

  /* Winner overlay */
  .winner-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(10, 11, 16, 0.55);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
    z-index: 40;
  }
  .winner-overlay.show { opacity: 1; }
  .winner-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px 48px;
    text-align: center;
    box-shadow: 0 12px 40px rgba(0,0,0,0.5);
  }
  .winner-icon { font-size: 40px; margin-bottom: 8px; }
  .winner-title { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
  .winner-title.win-blue { color: var(--blue-team); }
  .winner-title.win-red { color: var(--red-team); }
  .winner-title.draw { color: var(--accent-yellow); }
  .winner-subtitle { font-size: 13px; color: var(--text-secondary); }
</style>
</head>
<body>

<!-- Drop zone (shown when no file loaded) -->
<div class="drop-overlay" id="dropOverlay">
  <div class="drop-box" id="dropBox">
    <div class="drop-icon">🏰</div>
    <div class="drop-title">Clash Royale Replay Viewer</div>
    <div class="drop-subtitle">Drop a game log JSON file here, or click to browse</div>
    <button class="file-input-btn" onclick="document.getElementById('fileInput').click()">Choose File</button>
    <input type="file" id="fileInput" accept=".json">
  </div>
</div>

<!-- Main UI (shown after file loaded) -->
<div class="header">
  <div class="header-left">
    <h1>🏰 Clash Royale Env — Replay Viewer</h1>
    <span class="badge" id="fileNameBadge">No file</span>
    <span class="result-badge" id="resultBadge"></span>
  </div>
  <button class="file-input-btn" style="font-size:12px; padding:5px 14px;" onclick="document.getElementById('fileInput').click()">Load New</button>
</div>

<div class="main-layout">
  <div class="arena-panel">
    <div class="arena-row">
      <div class="gauge-panel">
        <div class="gauge-title">Agent Brain (Blue)</div>
        <canvas id="gaugeCanvas" width="200" height="140"></canvas>
        <div class="gauge-value" id="gaugeValueText">--</div>
        <div class="gauge-action" id="gaugeActionText">--</div>
      </div>
      <div class="canvas-wrapper">
        <canvas id="gameCanvas"></canvas>
        <div class="tooltip" id="tooltip">
          <div class="tooltip-name" id="tooltipName"></div>
          <div class="tooltip-stat" id="tooltipStat"></div>
        </div>
        <div class="winner-overlay" id="winnerOverlay">
          <div class="winner-card">
            <div class="winner-icon" id="winnerIcon">🏆</div>
            <div class="winner-title" id="winnerTitle">--</div>
            <div class="winner-subtitle" id="winnerSubtitle">--</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="sidebar">
    <!-- Match state -->
    <div class="panel">
      <div class="panel-title">Elixir</div>
      <div class="stat-row">
        <span class="stat-key" style="color:var(--blue-team)">BLUE</span>
        <div class="meter"><div class="meter-fill" id="elixirBarAI"></div></div>
        <span class="stat-num" id="elixirValAI">5.0</span>
      </div>
      <div class="stat-row">
        <span class="stat-key" style="color:var(--red-team)">RED</span>
        <div class="meter"><div class="meter-fill" id="elixirBarOpp"></div></div>
        <span class="stat-num" id="elixirValOpp">5.0</span>
      </div>
    </div>

    <!-- Player Hands -->
    <div class="panel">
      <div class="panel-title">Hands</div>
      <div class="hand-label" style="color:var(--blue-team)">BLUE</div>
      <div class="hand-grid" id="handCardsAI"></div>
      <div class="hand-label" style="color:var(--red-team)">RED</div>
      <div class="hand-grid" id="handCardsOpp"></div>
    </div>

    <!-- Tower HP -->
    <div class="panel">
      <div class="panel-title">Tower Health</div>
      <div class="tower-grid" id="towerGrid"></div>
    </div>

    <!-- Entity Inspector -->
    <div class="panel">
      <div class="panel-title">Entity Inspector</div>
      <div id="inspectorContent"><div class="inspector-empty">Click an entity on the arena</div></div>
    </div>

    <!-- Event Log -->
    <div class="panel event-log">
      <div class="panel-title">Event Log</div>
      <div class="event-log-inner" id="eventLog"></div>
    </div>
  </div>
</div>

<!-- Playback controls -->
<div class="controls">
  <button id="btnStepBack" title="Step Back">⏮</button>
  <button id="btnPlayPause" title="Play/Pause">▶</button>
  <button id="btnStepFwd" title="Step Forward">⏭</button>
  <div class="scrubber-container">
    <input type="range" class="scrubber" id="scrubber" min="0" max="0" value="0">
  </div>
  <div class="tick-display" id="tickDisplay">Tick 0 / 0</div>
  <span class="speed-label">Speed:</span>
  <select class="speed-select" id="speedSelect">
    <option value="4">0.25x</option>
    <option value="2">0.5x</option>
    <option value="1" selected>1x</option>
    <option value="0.5">2x</option>
    <option value="0.25">4x</option>
    <option value="0.125">8x</option>
  </select>
</div>

<script>
// Card data below is kept in sync with include/core/CardRegistry.h -- symbol,
// name and max-HP must match the C++ registry exactly or the HP bars/labels
// silently drift out of sync with the engine (as they had, before this pass).
const SYMBOL_NAMES = {
  'R': 'King Tower', 'P': 'Princess Tower',
  'K': 'Knight', 'g': 'Goblins', 'M': 'Mini PEKKA', 'B': 'Barbarians', 'V': 'Valkyrie',
  's': 'Skeleton Army', 'E': 'P.E.K.K.A.', 'p': 'Prince', 'e': 'Elite Barbarians',
  'l': 'Lumberjack', 'k': 'Skeletons', 'J': 'Giant Skeleton', 'z': 'Electro Wizard',
  'm': 'Minions', 'h': 'Minion Horde', 'F': 'Mega Minion',
  'A': 'Archers', 'U': 'Musketeer', 'b': 'Bomber', 'W': 'Wizard', 'd': 'Dart Goblin',
  'w': 'Bowler', 'S': 'Spear Goblins', 'i': 'Ice Wizard', 'x': 'Executioner', 'y': 'Baby Dragon',
  'G': 'Giant', 'H': 'Hog Rider', 'L': 'Golem', 'c': 'Ice Golem', 'a': 'Balloon',
  'Y': 'Royal Giant', 'q': 'Golemite',
  'C': 'Cannon', 'T': 'Tesla', 'D': 'Bomb Tower', 'I': 'Inferno Tower',
  '-': 'Projectile', '*': 'Arrows', 'O': 'Fireball', 'Z': 'Zap', 'r': 'Rocket',
  'j': 'Lightning', 'n': 'Poison', 'o': 'The Log'
};

const SPELL_SYMBOLS = new Set(['-', '*', 'O', 'Z', 'r', 'j', 'n', 'o']);

const SYMBOL_RADIUS = {
  'P': 14, 'R': 16, 'G': 12, 'A': 8, 'K': 10, 'g': 7, 'M': 11, 'U': 9,
  'B': 9, 'b': 8, 'V': 10, 'W': 9, 's': 5, 'E': 13, 'p': 11, 'H': 11,
  'm': 9, 'F': 10, 'e': 10, 'Y': 12, 'L': 14, 'd': 7, 'l': 10, 'w': 11, 'S': 6,
  'k': 5, 'C': 12, 'T': 12, 'D': 13, 'I': 13, 'i': 9, 'z': 9, 'x': 10,
  'y': 10, 'h': 9, 'a': 11, 'J': 13, 'c': 10, 'q': 7,
  '-': 3, '*': 6, 'O': 7, 'Z': 5, 'r': 6, 'j': 7, 'n': 7, 'o': 6
};

// LEGACY FALLBACK ONLY -- these 4 tables (SYMBOL_NAMES above, plus the 3
// below) go stale the moment a new card is added and nobody remembers to
// update this file (confirmed happening in practice: Inferno Dragon's
// symbol '4' was missing from all of them, silently making MAX_HP[ent.symbol]
// fall back to `|| ent.hp` -- i.e. hpRatio = ent.hp/ent.hp = 1.0 forever, an
// Inferno Dragon that visually never took damage no matter how much it
// actually had). Replays now embed their own authoritative "cardMeta" block
// (id-keyed, generated live from CardRegistry -- see GameLogger::save()) plus
// each entity's own cardId, so this can never drift again; getEntityMeta()
// below prefers that and only falls through to these hardcoded tables for
// replay files saved before cardMeta/cardId existed. Left in place for that
// backward-compatibility case only -- do not "fix" these by hand again.
const MAX_HP = {
  'P': 2534, 'R': 4008,
  'K': 1766, 'g': 202, 'M': 1390, 'B': 670, 'V': 1907, 's': 81, 'E': 3760, 'p': 1920,
  'e': 1341, 'l': 1282, 'k': 81, 'J': 3361, 'z': 714,
  'm': 230, 'h': 230, 'F': 837,
  'A': 304, 'U': 721, 'b': 304, 'W': 755, 'd': 261, 'w': 2081, 'S': 133, 'i': 688, 'x': 1280, 'y': 1152,
  'G': 4090, 'H': 1697, 'L': 5120, 'c': 1315, 'a': 1679, 'Y': 3164, 'q': 1039,
  'C': 824, 'T': 1152, 'D': 1356, 'I': 1748
};

const BUILDING_SYMBOLS = new Set(['P', 'R', 'C', 'T', 'D', 'I']);

// Fallback for replay files saved before the isFlying field was added to the
// log -- ent.isFlying (from the engine) is always preferred when present.
const FLYING_SYMBOLS_FALLBACK = new Set(['m', 'h', 'F', 'y', 'a']);

// Populated per-loaded-replay from gameData.cardMeta (id-keyed) in
// initViewer() -- see getEntityMeta() below, the one place everything else
// in this file should go through instead of touching the legacy tables
// above directly.
let CARD_META = {};

// Symbol -> meta, derived from the replay's OWN cardMeta block. This is the
// fallback for entities carrying cardId -1 (Entity.h:45's default -- nothing
// assigns one for death-spawns, spawner buildings or tower troops), which the
// id-keyed lookup cannot resolve.
//
// Symbols genuinely collide: 'M' is both Mini PEKKA (1390 hp) and Monk (2214).
// For a cardId -1 entity that collision is not resolvable, so the ambiguous
// set is recorded and such a resolution is flagged `inferred` rather than
// silently presenting whichever card happened to load last as certain.
let SYMBOL_INDEX = { bySymbol: {}, ambiguous: new Set() };

function buildSymbolIndex(cardMeta) {
  const bySymbol = {}, ambiguous = new Set();
  for (const id of Object.keys(cardMeta || {})) {
    const meta = cardMeta[id];
    if (!meta || !meta.symbol) continue;
    const seen = bySymbol[meta.symbol];
    if (seen && seen.name !== meta.name) ambiguous.add(meta.symbol);
    else if (!seen) bySymbol[meta.symbol] = meta;
  }
  return { bySymbol, ambiguous };
}

// maxHp 0 means a spell (no persistent HP to bar-render) or a card the legacy
// table never knew. Render an em dash -- NEVER '?', which is what the old
// `meta.maxHp || '?'` produced for every spell in the deck.
function formatMaxHp(meta) {
  return (meta && meta.maxHp > 0) ? String(meta.maxHp) : '—';
}

// Single source of truth for "what is this entity" from here on. Prefers,
// in order: (1) TOWER_DEFS by entity id (towers aren't cards, so cardMeta
// never covers them -- this table's own per-corner names/HP are already
// accurate and unrelated to the drift problem this fixes); (2) CARD_META by
// ent.cardId (accurate, collision-free -- unlike symbol, which several
// unrelated cards legitimately share with DIFFERENT maxHp, e.g. 'M' is both
// Mini PEKKA at 1390 and Monk at 2214: a symbol-only lookup silently picks
// whichever one happens to load last); (3) the legacy symbol-keyed tables,
// only reached for a replay saved before cardId/cardMeta existed.
function getEntityMeta(ent) {
  const towerDef = TOWER_DEFS.find(td => td.id === ent.id);
  if (towerDef) return { name: towerDef.name, maxHp: towerDef.maxHp, isBuilding: true,
                         isSpell: false, isFlying: false, inferred: false };
  if (ent.cardId !== undefined && CARD_META[ent.cardId]) {
    return Object.assign({ inferred: false }, CARD_META[ent.cardId]);
  }
  // cardId missing or -1: resolve by symbol against the replay's OWN registry
  // data before falling through to the legacy hardcoded tables, which cover
  // only ~45 of the 173 registry entries.
  const fromSym = SYMBOL_INDEX.bySymbol[ent.symbol];
  if (fromSym) {
    return Object.assign({}, fromSym, {
      inferred: true,
      ambiguous: SYMBOL_INDEX.ambiguous.has(ent.symbol),
    });
  }
  return {
    // NEVER the bare symbol. CardDefinition's default symbol is '?'
    // (CardRegistry.h:100) and two registry cards ship it explicitly -- Cannon
    // Cart (69) and Guards (76) -- so `|| ent.symbol` rendered a literal '?'
    // as a card NAME. That is the reported bug.
    name: SYMBOL_NAMES[ent.symbol] || `Unknown (symbol '${ent.symbol}')`,
    // 0, not `|| ent.hp`: the old fallback made hpRatio = hp/hp = 1.0 forever,
    // so an unrecognised card's HP bar never moved however much damage it took.
    maxHp: MAX_HP[ent.symbol] || 0,
    isBuilding: BUILDING_SYMBOLS.has(ent.symbol),
    isSpell: SPELL_SYMBOLS.has(ent.symbol),
    isFlying: FLYING_SYMBOLS_FALLBACK.has(ent.symbol),
    inferred: true,
  };
}

// ent.isFlying (logged live per-entity by the engine) is always preferred
// over the card-level default when present -- see FLYING_SYMBOLS_FALLBACK's
// own comment on why (pre-isFlying-field replays only).
function isEntityFlying(ent) {
  if (ent.isFlying !== undefined) return ent.isFlying;
  return getEntityMeta(ent).isFlying;
}

// Icon shapes rather than letters -- a letter badge risked colliding with the
// entity's own symbol letter (e.g. Giant's symbol is 'G', same letter the
// "ground" badge would have used), which read as a confusing double-label.
const TYPE_BADGE = {
  ground: { color: '#C9C9CE' },
  air: { color: '#8E8E93' },
  building: { color: '#6E6E73' },
  spell: { color: '#B9B9C0' }
};

// Actual tower IDs assigned by Board::allocateId() (idCounter starts at 1000,
// then GameManager::reset() creates King/Princess towers in this exact
// order every episode). The tower panel previously looked for IDs
// 100/101/102/110/111/112, which never existed, so HP never showed.
const TOWER_DEFS = [
  { id: 1000, name: 'Blue King', team: 0, maxHp: 4008 },
  { id: 1001, name: 'Red King', team: 1, maxHp: 4008 },
  { id: 1002, name: 'Blue Left P', team: 0, maxHp: 2534 },
  { id: 1003, name: 'Blue Right P', team: 0, maxHp: 2534 },
  { id: 1004, name: 'Red Left P', team: 1, maxHp: 2534 },
  { id: 1005, name: 'Red Right P', team: 1, maxHp: 2534 },
];

const CELL_SIZE = 22;
const PADDING = 12;

// Arena geometry. NOT derivable from the replay JSON, so hardcoded here with
// the header that owns each value NAMED -- the pattern CLAUDE.md requires and
// perception/geometry.py already follows ("live where derivable, hardcoded
// with a comment naming the header where not").
//
//   include/core/ArenaLayout.h : LEFT_BRIDGE_X = 2.5, RIGHT_BRIDGE_X = 14.5
//   include/core/Board.h       : BRIDGE_HALF_WIDTH = 1.0
//
// A bridge centre sits on the SEAM between two tiles, so 2.5 +/- 1.0 spans
// exactly cells 2 and 3, reproducing the real river row WWBBWWWWWWWWWWBBWW.
//
// This file previously said [[3,4],[13,14]] -- the arena as it stood BEFORE
// the 2026-08-21 re-centring -- and so painted four of the eighteen columns
// wrong in both directions: 2 and 15 are real bridge and were drawn as water,
// 4 and 13 are water and were drawn as bridge. Exactly the same stale-copy
// failure that hit ClashEnv::extractObservationForTeam's channel 8, which was
// fixed the same day; this was the copy nobody checked.
const BRIDGE_CELLS = [[2, 3], [14, 15]];

// include/core/Board.h : riverY_start = 15.5, riverY_end = 17.5. A cell i
// covers [i-0.5, i+0.5], so the band is exactly integer rows 16 and 17.
const RIVER_ROWS = [16, 17];

// CSS custom properties, read once and cached. The palette is static at
// runtime, and drawBoard paints 18*34 = 612 lawn tiles per frame -- calling
// getComputedStyle inside that loop would dominate the frame.
const _cssCache = {};
function cssVar(name) {
  let v = _cssCache[name];
  if (v === undefined) {
    v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    _cssCache[name] = v;
  }
  return v;
}

// A render context bundles everything a board drawing needs, so the main arena
// and the Simulation View's mini-boards can share one drawing path instead of
// growing a second renderer that drifts from the first.
function makeRenderCtx(ctx2d, boardWidth, boardHeight, cellSize, padding) {
  return {
    ctx: ctx2d,
    boardWidth, boardHeight, cellSize, padding,
    width: boardWidth * cellSize + padding * 2,
    height: boardHeight * cellSize + padding * 2,
  };
}

function mainRc() {
  return makeRenderCtx(ctx, gameData.boardWidth, gameData.boardHeight,
                       CELL_SIZE, PADDING);
}

let gameData = null;
let currentTick = 0;
let playing = false;
let playInterval = null;
let selectedEntityId = null;
let matchResult = null;

// DOM elements
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scrubber = document.getElementById('scrubber');
const tickDisplay = document.getElementById('tickDisplay');
const btnPlayPause = document.getElementById('btnPlayPause');
const btnStepBack = document.getElementById('btnStepBack');
const btnStepFwd = document.getElementById('btnStepFwd');
const speedSelect = document.getElementById('speedSelect');
const dropOverlay = document.getElementById('dropOverlay');
const dropBox = document.getElementById('dropBox');
const fileInput = document.getElementById('fileInput');
const tooltip = document.getElementById('tooltip');
const tooltipName = document.getElementById('tooltipName');
const tooltipStat = document.getElementById('tooltipStat');
const winnerOverlay = document.getElementById('winnerOverlay');

// File loading
fileInput.addEventListener('change', (e) => {
  if (e.target.files[0]) loadFile(e.target.files[0]);
});

dropBox.addEventListener('dragover', (e) => { e.preventDefault(); dropBox.classList.add('drag-over'); });
dropBox.addEventListener('dragleave', () => dropBox.classList.remove('drag-over'));
dropBox.addEventListener('drop', (e) => {
  e.preventDefault();
  dropBox.classList.remove('drag-over');
  if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
});

function loadFile(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      gameData = JSON.parse(e.target.result);
      initViewer();
      dropOverlay.classList.add('hidden');
      document.getElementById('fileNameBadge').textContent = file.name;
    } catch (err) {
      alert('Failed to parse JSON: ' + err.message);
    }
  };
  reader.readAsText(file);
}

function initViewer() {
  // See getEntityMeta()'s own comment -- empty object (not an error) for a
  // replay saved before cardMeta existed, which just means every entity
  // falls through to the legacy symbol-keyed tables instead.
  CARD_META = gameData.cardMeta || {};
  SYMBOL_INDEX = buildSymbolIndex(CARD_META);

  const w = gameData.boardWidth * CELL_SIZE + PADDING * 2;
  const h = gameData.boardHeight * CELL_SIZE + PADDING * 2;
  canvas.width = w;
  canvas.height = h;
  currentTick = 0;
  selectedEntityId = null;
  scrubber.max = gameData.ticks.length - 1;
  scrubber.value = 0;

  detectAllEvents();
  matchResult = computeMatchResult();
  updateResultBadge();
  renderTick();
  updateUI();
}

// Winner detection -- READS the verdict the engine wrote into the replay. It
// does not re-derive one.
//
// The previous version checked only whether both King Towers were still alive
// and called anything else a draw. Its comment said it "mirrors
// MatchRules::evaluate exactly", which was TRUE and was precisely the bug:
// MatchRules answers "has a King died YET?", is called every tick, and correctly
// reports "not over" right up to the tick limit. Who WON at the limit is
// TimeoutRules -- fewer surviving towers loses; on equal counts the side whose
// weakest surviving tower has the lower ABSOLUTE hp loses; only an exact tie on
// both is a draw. A timed-out match with a Princess Tower at 90 hp was being
// displayed as "Draw. Timeout — both King Towers still standing".
//
// The Python-side guard against this pattern (test_match_outcome_is_the_only_
// scorer.py) walks .py files only, which is exactly why the defect survived here
// in JavaScript. It now checks this file too.
function computeMatchResult() {
  if (!gameData || !gameData.ticks.length) return null;

  // The engine's own verdict, written by GameLogger::resultJson().
  if (gameData.result) {
    const r = gameData.result;
    if (r.loserTeam === -1) return { winner: 'draw', reason: r.reason };
    return { winner: r.loserTeam === 0 ? 'red' : 'blue', reason: r.reason };
  }

  // Replays written before the engine emitted `result`. A PORT of TimeoutRules,
  // not the old king-alive-only shortcut -- an out-of-date replay should be
  // scored by the right rule, not by the one this fix exists to remove.
  const finalTick = gameData.ticks[gameData.ticks.length - 1];
  const towers = finalTick.entities.filter(e => e.symbol === 'R' || e.symbol === 'P');
  const kingAlive = [0, 1].map(t => towers.some(e => e.symbol === 'R' && e.team === t));

  if (!kingAlive[0] || !kingAlive[1]) {
    if (!kingAlive[0] && !kingAlive[1])
      return { winner: 'draw', reason: 'Both King Towers fell the same tick' };
    return {
      winner: kingAlive[0] ? 'blue' : 'red',
      reason: kingAlive[0] ? "Red's King Tower destroyed" : "Blue's King Tower destroyed"
    };
  }

  const count = [0, 1].map(t => towers.filter(e => e.team === t).length);
  if (count[0] !== count[1]) {
    return {
      winner: count[0] > count[1] ? 'blue' : 'red',
      reason: 'Timeout — decided on surviving tower count'
    };
  }
  const weakest = [0, 1].map(t =>
    Math.min(...towers.filter(e => e.team === t).map(e => e.hp)));
  if (weakest[0] !== weakest[1]) {
    return {
      winner: weakest[0] > weakest[1] ? 'blue' : 'red',
      reason: "Timeout — decided on the weakest tower's HP"
    };
  }
  return { winner: 'draw', reason: 'Timeout — exact tie on towers and weakest-tower HP' };
}

function updateResultBadge() {
  const el = document.getElementById('resultBadge');
  if (!matchResult) { el.classList.remove('show'); return; }
  el.classList.add('show');
  if (matchResult.winner === 'draw') {
    el.textContent = '🤝 Draw';
    el.className = 'result-badge show draw';
  } else if (matchResult.winner === 'blue') {
    el.textContent = '🔵 Blue Wins';
    el.className = 'result-badge show win-blue';
  } else {
    el.textContent = '🔴 Red Wins';
    el.className = 'result-badge show win-red';
  }
}

function updateWinnerOverlay() {
  const isFinalTick = currentTick === gameData.ticks.length - 1;
  if (!isFinalTick || !matchResult) {
    winnerOverlay.classList.remove('show');
    return;
  }
  const icon = document.getElementById('winnerIcon');
  const title = document.getElementById('winnerTitle');
  const subtitle = document.getElementById('winnerSubtitle');
  if (matchResult.winner === 'draw') {
    icon.textContent = '🤝';
    title.textContent = 'Draw';
    title.className = 'winner-title draw';
  } else if (matchResult.winner === 'blue') {
    icon.textContent = '🏆';
    title.textContent = 'Blue Wins';
    title.className = 'winner-title win-blue';
  } else {
    icon.textContent = '🏆';
    title.textContent = 'Red Wins';
    title.className = 'winner-title win-red';
  }
  subtitle.textContent = matchResult.reason;
  winnerOverlay.classList.add('show');
}

// Coordinate conversion
function gameToCanvas(rc, gx, gy) {
  return {
    x: rc.padding + gx * rc.cellSize + rc.cellSize / 2,
    y: rc.padding + (rc.boardHeight - 1 - gy) * rc.cellSize + rc.cellSize / 2
  };
}

function canvasToGame(rc, cx, cy) {
  return {
    gx: (cx - rc.padding) / rc.cellSize,
    gy: rc.boardHeight - 1 - (cy - rc.padding) / rc.cellSize
  };
}


function getEntityType(ent) {
  const meta = getEntityMeta(ent);
  if (meta.isSpell) return 'spell';
  if (meta.isBuilding) return 'building';
  return isEntityFlying(ent) ? 'air' : 'ground';
}

// Event detection
let allEvents = [];
function detectAllEvents() {
  allEvents = [];
  let prev = new Map();

  for (let i = 0; i < gameData.ticks.length; i++) {
    const tick = gameData.ticks[i];
    const curr = new Map();

    for (const ent of tick.entities) {
      if (getEntityMeta(ent).isSpell) continue;
      curr.set(ent.id, ent);
      if (!prev.has(ent.id)) {
        allEvents.push({
          tick: tick.tick,
          tickIndex: i,
          type: 'spawn',
          name: getEntityMeta(ent).name,
          team: ent.team,
          id: ent.id,
          hp: ent.hp
        });
      }
    }

    for (const [id, ent] of prev) {
      if (!curr.has(id)) {
        allEvents.push({
          tick: tick.tick,
          tickIndex: i,
          type: 'death',
          name: getEntityMeta(ent).name,
          team: ent.team,
          id: id
        });
      }
    }
    prev = curr;
  }
}

// Rendering
function renderTick() {
  if (!gameData) return;
  const tickData = gameData.ticks[currentTick];
  if (!tickData) return;
  drawBoard(mainRc(), tickData, {
    selectedEntityId: selectedEntityId,
    showLabels: true,
    ghost: false,
  });
}

// Cached static board layer. Keyed on the geometry it depends on, so a replay
// with a different board size (or a mini-board at another scale) gets its own.
const _bgCache = {};
function boardBackground(rc) {
  const key = rc.boardWidth + 'x' + rc.boardHeight + '@' + rc.cellSize + '+' + rc.padding;
  if (_bgCache[key]) return _bgCache[key];

  const cv = document.createElement('canvas');
  cv.width = rc.width;
  cv.height = rc.height;
  const ctx2 = cv.getContext('2d');
  const cs = rc.cellSize, pad = rc.padding, w = rc.width, h = rc.height;
  const C = cssVar;


  // Surround: the treeline the arena island sits on.
  ctx2.fillStyle = C('--arena-surround');
  ctx2.fillRect(0, 0, w, h);

  // The lawn, as a mown checker. NO team territory tint: the real arena is one
  // green field, and tinting each half red/blue was the single biggest reason
  // this viewer did not read as Clash Royale. Team identity comes from tower
  // and unit colour instead.
  for (let x = 0; x < rc.boardWidth; x++) {
    for (let y = 0; y < rc.boardHeight; y++) {
      ctx2.fillStyle = ((x + y) % 2 === 0) ? C('--grass-light') : C('--grass-dark');
      ctx2.fillRect(pad + x * cs, pad + y * cs, cs, cs);
    }
  }

  // Lane paths, bridge column to board edge. Drawn BEFORE the river so the
  // water covers them, and before the bridges so the decks sit on top.
  ctx2.fillStyle = C('--lane-path');
  for (const [c0, c1] of BRIDGE_CELLS) {
    ctx2.fillRect(pad + c0 * cs, pad, (c1 - c0 + 1) * cs, h - pad * 2);
  }

  // River. RIVER_ROWS are GAME rows; canvas row = boardHeight - 1 - gameRow,
  // so the band's top edge comes from the HIGHER game row.
  const riverTop = pad + (rc.boardHeight - 1 - RIVER_ROWS[1]) * cs;
  const riverBottom = pad + (rc.boardHeight - RIVER_ROWS[0]) * cs;
  ctx2.fillStyle = C('--river');
  ctx2.fillRect(pad, riverTop, w - pad * 2, riverBottom - riverTop);
  ctx2.fillStyle = C('--river-edge');
  ctx2.fillRect(pad, riverTop, w - pad * 2, Math.max(1, cs * 0.12));

  // Bridges, over the river band.
  for (const [c0, c1] of BRIDGE_CELLS) {
    const bleft = pad + c0 * cs;
    const bright = pad + (c1 + 1) * cs;
    ctx2.fillStyle = C('--bridge-deck');
    ctx2.fillRect(bleft, riverTop, bright - bleft, riverBottom - riverTop);
    ctx2.strokeStyle = C('--bridge-seam');
    ctx2.lineWidth = Math.max(1, cs * 0.06);
    for (let pl = 1; pl < 4; pl++) {
      const py = riverTop + (riverBottom - riverTop) * (pl / 4);
      ctx2.beginPath();
      ctx2.moveTo(bleft, py); ctx2.lineTo(bright, py);
      ctx2.stroke();
    }
  }

  // Faint tile grid, for judging placement. Over the lawn, under the units.
  ctx2.strokeStyle = 'rgba(0,0,0,0.055)';
  ctx2.lineWidth = 1;
  for (let x = 0; x <= rc.boardWidth; x++) {
    const px = pad + x * cs;
    ctx2.beginPath(); ctx2.moveTo(px, pad); ctx2.lineTo(px, h - pad); ctx2.stroke();
  }
  for (let y = 0; y <= rc.boardHeight; y++) {
    const py = pad + y * cs;
    ctx2.beginPath(); ctx2.moveTo(pad, py); ctx2.lineTo(w - pad, py); ctx2.stroke();
  }


  _bgCache[key] = cv;
  return cv;
}

// The ONE board renderer. The main arena and the Simulation View's mini-boards
// both come through here, so a palette or geometry change cannot apply to one
// and not the other -- the failure mode this file already suffered when its
// bridge columns drifted from the engine's.
//
//   rc    -- from makeRenderCtx: canvas context plus board dims and scale
//   opts  -- { selectedEntityId, showLabels, ghost }
function drawBoard(rc, tickData, opts) {
  const w = rc.width;
  const h = rc.height;

  const cs = rc.cellSize, pad = rc.padding;

  // The lawn, paths, river, bridges and grid are STATIC for a given board size
  // -- nothing about them changes while scrubbing. Painting them per frame
  // means 612 fillRects plus 52 strokes every tick, which measured 127 ms/frame
  // on this box. Rendered once into an offscreen canvas and blitted, the same
  // background costs one drawImage.
  rc.ctx.clearRect(0, 0, w, h);
  rc.ctx.drawImage(boardBackground(rc), 0, 0);

  if (opts.showLabels) {
    rc.ctx.font = '10px Inter, sans-serif';
    rc.ctx.textAlign = 'center';
    rc.ctx.fillStyle = 'rgba(74, 158, 255, 0.55)';
    rc.ctx.fillText('BLUE', w / 2, h - pad + 9);
    rc.ctx.fillStyle = 'rgba(255, 82, 82, 0.55)';
    rc.ctx.fillText('RED', w / 2, pad - 4);
  }

  // Entities
  const entities = tickData.entities;

  for (const ent of entities) {
    if (getEntityMeta(ent).isSpell) {
      drawEntity(rc, ent, false);
    }
  }

  for (const ent of entities) {
    if (!getEntityMeta(ent).isSpell) {
      drawEntity(rc, ent, ent.id === opts.selectedEntityId);
    }
  }
}


function drawTypeBadge(rc, ent, pos, radius) {
  if (ent.symbol === '-') return; // raw projectile is too small for a badge to read
  const type = getEntityType(ent);
  const badge = TYPE_BADGE[type];
  const bx = pos.x + radius * 0.62;
  const by = pos.y - radius * 0.62;

  rc.ctx.beginPath();
  rc.ctx.arc(bx, by, 6, 0, Math.PI * 2);
  rc.ctx.fillStyle = badge.color;
  rc.ctx.fill();
  rc.ctx.strokeStyle = 'rgba(0,0,0,0.5)';
  rc.ctx.lineWidth = 1;
  rc.ctx.stroke();

  // Shape glyph, not a letter -- ground: dot, air: chevron, building: square, spell: diamond
  rc.ctx.fillStyle = '#0b0d13';
  rc.ctx.strokeStyle = '#0b0d13';
  rc.ctx.lineWidth = 1.4;
  if (type === 'ground') {
    rc.ctx.beginPath();
    rc.ctx.arc(bx, by, 2, 0, Math.PI * 2);
    rc.ctx.fill();
  } else if (type === 'air') {
    rc.ctx.beginPath();
    rc.ctx.moveTo(bx - 3, by + 1.5);
    rc.ctx.lineTo(bx, by - 2.5);
    rc.ctx.lineTo(bx + 3, by + 1.5);
    rc.ctx.stroke();
  } else if (type === 'building') {
    rc.ctx.strokeRect(bx - 2.5, by - 2.5, 5, 5);
  } else {
    rc.ctx.beginPath();
    rc.ctx.moveTo(bx, by - 3);
    rc.ctx.lineTo(bx + 3, by);
    rc.ctx.lineTo(bx, by + 3);
    rc.ctx.lineTo(bx - 3, by);
    rc.ctx.closePath();
    rc.ctx.fill();
  }
}

function drawEntity(rc, ent, isSelected) {
  const pos = gameToCanvas(rc, ent.x, ent.y);
  const radius = SYMBOL_RADIUS[ent.symbol] || 8;
  const isBlue = ent.team === 0;
  const mainColor = isBlue ? '#4a9eff' : '#ff5252';
  const dimColor = isBlue ? '#1a3a66' : '#661a1a';
  const meta = getEntityMeta(ent);

  if (meta.isSpell && ent.symbol !== '-') {
    const spellRadius = ent.symbol === '*' ? 4.0 : 2.5;
    const pixelRadius = spellRadius * rc.cellSize;
    rc.ctx.beginPath();
    rc.ctx.arc(pos.x, pos.y, pixelRadius, 0, Math.PI * 2);
    rc.ctx.fillStyle = isBlue ? 'rgba(74, 158, 255, 0.08)' : 'rgba(255, 82, 82, 0.08)';
    rc.ctx.fill();
    rc.ctx.strokeStyle = isBlue ? 'rgba(74, 158, 255, 0.25)' : 'rgba(255, 82, 82, 0.25)';
    rc.ctx.lineWidth = 1;
    rc.ctx.stroke();
  }

  // Projectiles: small dot with trail
  if (ent.symbol === '-') {
    rc.ctx.beginPath();
    rc.ctx.arc(pos.x, pos.y, 3, 0, Math.PI * 2);
    rc.ctx.fillStyle = mainColor;
    rc.ctx.fill();
    return;
  }

  // Selection ring
  if (isSelected) {
    rc.ctx.beginPath();
    rc.ctx.arc(pos.x, pos.y, radius + 4, 0, Math.PI * 2);
    rc.ctx.strokeStyle = '#facc15';
    rc.ctx.lineWidth = 2;
    rc.ctx.stroke();
  }

  // Shadow (single, subtle -- previously stacked with an extra glow ring)
  rc.ctx.beginPath();
  rc.ctx.arc(pos.x + 1, pos.y + 2, radius, 0, Math.PI * 2);
  rc.ctx.fillStyle = 'rgba(0,0,0,0.25)';
  rc.ctx.fill();

  if (meta.isBuilding) {
    const sizeInTiles = ent.symbol === 'R' ? 4 : (ent.symbol === 'P' ? 3 : 2);
    const sz = sizeInTiles * rc.cellSize;
    const x0 = pos.x - sz / 2, y0 = pos.y - sz / 2;
    const r = Math.max(2, rc.cellSize * 0.18);

    // Stone body with a team-tinted face, rounded rather than a hard square --
    // a flat rect read as a debug overlay against the new arena art.
    rc.ctx.beginPath();
    if (rc.ctx.roundRect) rc.ctx.roundRect(x0, y0, sz, sz, r);
    else rc.ctx.rect(x0, y0, sz, sz);
    const g = rc.ctx.createLinearGradient(x0, y0, x0, y0 + sz);
    g.addColorStop(0, isBlue ? '#3E6E9E' : '#9E4444');
    g.addColorStop(1, dimColor);
    rc.ctx.fillStyle = g;
    rc.ctx.fill();
    rc.ctx.strokeStyle = mainColor;
    rc.ctx.lineWidth = 2;
    rc.ctx.stroke();

    // Inner icon
    rc.ctx.fillStyle = '#fff';
    rc.ctx.font = `bold ${radius}px Inter, sans-serif`;
    rc.ctx.textAlign = 'center';
    rc.ctx.textBaseline = 'middle';
    rc.ctx.fillText(ent.symbol, pos.x, pos.y + 1);
  }
  // Troops: flat-ish circle (dropped the extra outer glow ring -- with many
  // units on screen the overlapping halos were the main source of visual
  // clutter)
  else if (!meta.isSpell) {
    const bodyGrad = rc.ctx.createRadialGradient(pos.x - 2, pos.y - 2, 1, pos.x, pos.y, radius);
    bodyGrad.addColorStop(0, mainColor);
    bodyGrad.addColorStop(1, dimColor);
    rc.ctx.beginPath();
    rc.ctx.arc(pos.x, pos.y, radius, 0, Math.PI * 2);
    rc.ctx.fillStyle = bodyGrad;
    rc.ctx.fill();
    rc.ctx.strokeStyle = mainColor;
    rc.ctx.lineWidth = 1.5;
    rc.ctx.stroke();

    // Symbol text
    rc.ctx.fillStyle = '#fff';
    rc.ctx.font = `bold ${Math.max(9, radius - 1)}px Inter, sans-serif`;
    rc.ctx.textAlign = 'center';
    rc.ctx.textBaseline = 'middle';
    rc.ctx.fillText(ent.symbol, pos.x, pos.y + 1);
  }
  // Spells: pulsing circle
  else {
    const pulse = 1 + Math.sin(currentTick * 0.3) * 0.15;
    rc.ctx.beginPath();
    rc.ctx.arc(pos.x, pos.y, radius * pulse, 0, Math.PI * 2);
    rc.ctx.fillStyle = isBlue ? 'rgba(74, 158, 255, 0.6)' : 'rgba(255, 82, 82, 0.6)';
    rc.ctx.fill();
  }

  drawTypeBadge(rc, ent, pos, radius);

  if (!meta.isSpell) {
    // maxHp can be 0 for an unrecognised card; a full bar is the honest
    // rendering there, since the true maximum is genuinely unknown.
    const hpRatio = meta.maxHp > 0
      ? Math.max(0, Math.min(1, ent.hp / meta.maxHp))
      : 1;
    const barWidth = radius * 2.2;
    const barHeight = 3;
    const barX = pos.x - barWidth / 2;
    const barY = pos.y - radius - 8;

    // HP bar background
    rc.ctx.fillStyle = 'rgba(0,0,0,0.5)';
    rc.ctx.fillRect(barX - 1, barY - 1, barWidth + 2, barHeight + 2);

    // HP bar fill
    let hpColor;
    if (hpRatio > 0.5) hpColor = '#4ade80';
    else if (hpRatio > 0.25) hpColor = '#facc15';
    else hpColor = '#ff5252';

    rc.ctx.fillStyle = hpColor;
    rc.ctx.fillRect(barX, barY, barWidth * hpRatio, barHeight);
  }
}

// UI updates
function updateUI() {
  if (!gameData) return;
  const tickData = gameData.ticks[currentTick];
  if (!tickData) return;

  // Tick display
  tickDisplay.textContent = `Tick ${tickData.tick} / ${gameData.ticks[gameData.ticks.length - 1].tick}`;
  scrubber.value = currentTick;

  // Elixir
  document.getElementById('elixirBarAI').style.width = (tickData.elixirAI / 10 * 100) + '%';
  document.getElementById('elixirValAI').textContent = tickData.elixirAI.toFixed(1);
  document.getElementById('elixirBarOpp').style.width = (tickData.elixirOpp / 10 * 100) + '%';
  document.getElementById('elixirValOpp').textContent = tickData.elixirOpp.toFixed(1);

  updateHandPanel(tickData);
  updateTowerPanel(tickData);
  updateAgentBrain(tickData);
  updateInspector(tickData);
  updateEventLog();
  updateWinnerOverlay();
}

function updateTowerPanel(tickData) {
  const grid = document.getElementById('towerGrid');
  grid.innerHTML = '';

  for (const td of TOWER_DEFS) {
    const ent = tickData.entities.find(e => e.id === td.id);
    const hp = ent ? ent.hp : 0;
    const ratio = hp / td.maxHp;
    const teamColor = td.team === 0 ? 'var(--blue-team)' : 'var(--red-team)';

    const card = document.createElement('div');
    card.className = 'tower-card' + (hp <= 0 ? ' destroyed' : '');
    card.innerHTML = `
      <div class="tower-card-header">
        <span class="tower-name">${td.name}</span>
        <span class="tower-hp-num" style="color:${teamColor}">${hp}</span>
      </div>
      <div class="meter">
        <div class="meter-fill" style="width:${Math.max(0, ratio)*100}%; background:${teamColor}"></div>
      </div>`;
    grid.appendChild(card);
  }
}

// Shows what the network is "thinking" right now: the critic's state-value
// estimate (how good it currently believes this position is) as a
// speedometer-style dial, plus the action it actually sampled at the
// decision governing this tick. Gauge range is +/-2 -- observed values
// during real training stay within that band (e.g. a decisive winning
// position reads ~+1.2, a losing one ~-1.3), so +/-2 gives headroom
// without wasting most of the dial on extremes that don't really happen.
const GAUGE_RANGE = 2.0;
const gaugeCanvas = document.getElementById('gaugeCanvas');
const gaugeCtx = gaugeCanvas.getContext('2d');

function drawGauge(stateValue) {
  const w = gaugeCanvas.width, h = gaugeCanvas.height;
  gaugeCtx.clearRect(0, 0, w, h);

  const cx = w / 2, cy = h - 18, r = 68;
  const hasData = stateValue !== undefined;
  const clamped = Math.max(-GAUGE_RANGE, Math.min(GAUGE_RANGE, hasData ? stateValue : 0));
  const t = (clamped + GAUGE_RANGE) / (2 * GAUGE_RANGE); // 0..1 across the dial

  // Background arc: red (negative) left half, green (positive) right half --
  // canvas angle Math.PI = pointing left, 1.5*Math.PI = up, 2*Math.PI = right.
  gaugeCtx.lineWidth = 10;
  gaugeCtx.lineCap = 'round';
  gaugeCtx.strokeStyle = 'rgba(255, 82, 82, 0.35)';
  gaugeCtx.beginPath();
  gaugeCtx.arc(cx, cy, r, Math.PI, 1.5 * Math.PI);
  gaugeCtx.stroke();
  gaugeCtx.strokeStyle = 'rgba(74, 222, 128, 0.35)';
  gaugeCtx.beginPath();
  gaugeCtx.arc(cx, cy, r, 1.5 * Math.PI, 2 * Math.PI);
  gaugeCtx.stroke();

  // Ticks + labels at -2, -1, 0, +1, +2
  gaugeCtx.font = '10px Inter, sans-serif';
  gaugeCtx.textAlign = 'center';
  gaugeCtx.textBaseline = 'middle';
  for (let tv = -GAUGE_RANGE; tv <= GAUGE_RANGE; tv += 1) {
    const tt = (tv + GAUGE_RANGE) / (2 * GAUGE_RANGE);
    const angle = Math.PI + tt * Math.PI;
    const x1 = cx + (r - 8) * Math.cos(angle), y1 = cy + (r - 8) * Math.sin(angle);
    const x2 = cx + (r + 4) * Math.cos(angle), y2 = cy + (r + 4) * Math.sin(angle);
    gaugeCtx.strokeStyle = 'rgba(255,255,255,0.3)';
    gaugeCtx.lineWidth = 2;
    gaugeCtx.beginPath();
    gaugeCtx.moveTo(x1, y1);
    gaugeCtx.lineTo(x2, y2);
    gaugeCtx.stroke();

    const lx = cx + (r + 16) * Math.cos(angle), ly = cy + (r + 16) * Math.sin(angle);
    gaugeCtx.fillStyle = '#9aa0b2';
    gaugeCtx.fillText(tv > 0 ? '+' + tv : String(tv), lx, ly);
  }

  // Needle
  const needleAngle = Math.PI + t * Math.PI;
  const nx = cx + (r - 14) * Math.cos(needleAngle), ny = cy + (r - 14) * Math.sin(needleAngle);
  gaugeCtx.strokeStyle = !hasData ? '#5f6577' : (clamped >= 0 ? '#4ade80' : '#ff5252');
  gaugeCtx.lineWidth = 3;
  gaugeCtx.lineCap = 'round';
  gaugeCtx.beginPath();
  gaugeCtx.moveTo(cx, cy);
  gaugeCtx.lineTo(nx, ny);
  gaugeCtx.stroke();

  gaugeCtx.beginPath();
  gaugeCtx.arc(cx, cy, 5, 0, Math.PI * 2);
  gaugeCtx.fillStyle = '#e8eaed';
  gaugeCtx.fill();
}

function updateAgentBrain(tickData) {
  drawGauge(tickData.stateValue);

  const valueEl = document.getElementById('gaugeValueText');
  const actionEl = document.getElementById('gaugeActionText');

  if (tickData.stateValue === undefined) {
    valueEl.textContent = 'N/A';
    valueEl.style.color = '#5f6577';
    actionEl.textContent = 'No data (older replay file)';
    return;
  }

  const v = tickData.stateValue;
  valueEl.textContent = (v >= 0 ? '+' : '') + v.toFixed(3);
  valueEl.style.color = v >= 0 ? '#4ade80' : '#ff5252';

  if (tickData.actionCardId === undefined) {
    actionEl.textContent = 'N/A';
  } else if (tickData.actionCardId === -1 || tickData.actionCardId === null) {
    actionEl.textContent = 'No-op (holding elixir)';
  } else {
    const name = tickData.actionCardName || `Card #${tickData.actionCardId}`;
    actionEl.innerHTML = `<strong>${name}</strong> → (${tickData.actionX.toFixed(1)}, ${tickData.actionY.toFixed(1)})`;
  }
}

function updateInspector(tickData) {
  const el = document.getElementById('inspectorContent');
  if (selectedEntityId === null) {
    el.innerHTML = '<div class="inspector-empty">Click an entity on the arena</div>';
    return;
  }
  const ent = tickData.entities.find(e => e.id === selectedEntityId);
  if (!ent) {
    el.innerHTML = '<div class="inspector-empty">Entity no longer alive</div>';
    return;
  }
  const meta = getEntityMeta(ent);
  const teamStr = ent.team === 0 ? '<span style="color:var(--blue-team)">Blue</span>' : '<span style="color:var(--red-team)">Red</span>';
  const type = getEntityType(ent);
  const typeLabel = { ground: 'Ground', air: 'Air', building: 'Building', spell: 'Spell' }[type];
  // A spell has no persistent HP at all, so "1 / -" is meaningless for it.
  const hpLine = meta.isSpell
    ? '<div class="inspector-detail"><span>HP:</span> <strong>n/a</strong> <span>(spell)</span></div>'
    : `<div class="inspector-detail"><span>HP:</span> <strong>${ent.hp}</strong> / ${formatMaxHp(meta)}</div>`;

  el.innerHTML = `
    <div class="inspector-detail"><span>Name:</span> <strong>${meta.name}</strong></div>
    <div class="inspector-detail"><span>ID:</span> <strong>${ent.id}</strong></div>
    <div class="inspector-detail"><span>Team:</span> ${teamStr}</div>
    <div class="inspector-detail"><span>Type:</span> <strong>${typeLabel}</strong></div>
    ${hpLine}
    <div class="inspector-detail"><span>Position:</span> <strong>(${ent.x.toFixed(1)}, ${ent.y.toFixed(1)})</strong></div>
    <div class="inspector-detail"><span>Symbol:</span> <strong>${ent.symbol}</strong></div>`
    + (meta.inferred
        ? `<div class="inspector-note">identified by symbol${
             meta.ambiguous ? ' — this symbol is shared by more than one card' : ''
           }</div>`
        : '');
}

function updateEventLog() {
  const el = document.getElementById('eventLog');
  const tickNum = gameData.ticks[currentTick].tick;
  const relevantEvents = allEvents.filter(e => e.tick <= tickNum).slice(-40);

  el.innerHTML = '';
  for (const ev of relevantEvents.reverse()) {
    const div = document.createElement('div');
    div.className = 'event ' + (ev.type === 'spawn' ? 'event-spawn' : 'event-death');
    const teamColor = ev.team === 0 ? 'var(--blue-team)' : 'var(--red-team)';
    const icon = ev.type === 'spawn' ? '➕' : '💀';
    div.innerHTML = `<span class="event-tick">[${ev.tick}]</span> ${icon} <span style="color:${teamColor}">${ev.name}</span> <span style="color:var(--text-muted)">#${ev.id}</span>`;
    el.appendChild(div);
  }
}

// cardNames values are formatted "Hog Rider (4)" by GameLogger::save(), so the
// cost is recoverable from the name and needs no extra field in the replay.
function splitCardLabel(raw) {
  const m = /^(.*)\s\((\d+)\)$/.exec(raw || '');
  return m ? { name: m[1], cost: parseInt(m[2], 10) } : { name: raw, cost: null };
}

function updateHandPanel(tickData) {
  const cardNames = gameData.cardNames || {};

  function renderHandTile(container, handIds, elixir) {
    container.innerHTML = '';
    if (!handIds || handIds.length === 0) {
      container.innerHTML = '<span class="empty-note">No data</span>';
      return;
    }
    for (const id of handIds) {
      const raw = cardNames[id] || `Card #${id}`;
      const { name, cost } = splitCardLabel(raw);
      const tile = document.createElement('div');
      const broke = (cost !== null && elixir !== null && cost > elixir);
      tile.className = 'card-tile' + (broke ? ' unaffordable' : '');
      tile.title = raw;
      tile.innerHTML = `<span class="nm">${name}</span>`
        + (cost !== null ? `<span class="cost">${cost}</span>` : '');
      container.appendChild(tile);
    }
  }

  renderHandTile(document.getElementById('handCardsAI'),
                 tickData.aiHand,
                 tickData.elixirAI === undefined ? null : tickData.elixirAI);
  renderHandTile(document.getElementById('handCardsOpp'),
                 tickData.oppHand,
                 tickData.elixirOpp === undefined ? null : tickData.elixirOpp);
}

// Playback controls
function setPlaying(val) {
  playing = val;
  btnPlayPause.textContent = playing ? '⏸' : '▶';
  btnPlayPause.classList.toggle('active', playing);
  if (playing) startPlayback();
  else stopPlayback();
}

function startPlayback() {
  stopPlayback();
  const delay = parseFloat(speedSelect.value);
  const ms = Math.max(16, delay * 50);
  playInterval = setInterval(() => {
    if (currentTick < gameData.ticks.length - 1) {
      currentTick++;
      renderTick();
      updateUI();
    } else {
      setPlaying(false);
    }
  }, ms);
}

function stopPlayback() {
  if (playInterval) { clearInterval(playInterval); playInterval = null; }
}

btnPlayPause.addEventListener('click', () => setPlaying(!playing));
btnStepBack.addEventListener('click', () => {
  if (!gameData) return;
  setPlaying(false);
  if (currentTick > 0) { currentTick--; renderTick(); updateUI(); }
});
btnStepFwd.addEventListener('click', () => {
  if (!gameData) return;
  setPlaying(false);
  if (currentTick < gameData.ticks.length - 1) { currentTick++; renderTick(); updateUI(); }
});
scrubber.addEventListener('input', () => {
  if (!gameData) return;
  setPlaying(false);
  currentTick = parseInt(scrubber.value);
  renderTick();
  updateUI();
});
speedSelect.addEventListener('change', () => {
  if (playing) { stopPlayback(); startPlayback(); }
});

// Canvas interaction
canvas.addEventListener('click', (e) => {
  if (!gameData) return;
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const cx = (e.clientX - rect.left) * scaleX;
  const cy = (e.clientY - rect.top) * scaleY;
  const tickData = gameData.ticks[currentTick];
  const rc = mainRc();

  let closest = null;
  let closestDist = Infinity;

  for (const ent of tickData.entities) {
    if (ent.symbol === '-') continue;
    const pos = gameToCanvas(rc, ent.x, ent.y);
    const dist = Math.sqrt((cx - pos.x) ** 2 + (cy - pos.y) ** 2);
    const hitRadius = (SYMBOL_RADIUS[ent.symbol] || 8) + 4;

    // For buildings, use a larger hit area based on their tile size
    let checkRadius = hitRadius;
    if (ent.symbol === 'P') checkRadius = (3 * rc.cellSize) / 2;
    if (ent.symbol === 'R') checkRadius = (4 * rc.cellSize) / 2;

    if (dist < checkRadius && dist < closestDist) {
      closest = ent;
      closestDist = dist;
    }
  }

  selectedEntityId = closest ? closest.id : null;
  renderTick();
  updateUI();
});

canvas.addEventListener('mousemove', (e) => {
  if (!gameData) return;
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const cx = (e.clientX - rect.left) * scaleX;
  const cy = (e.clientY - rect.top) * scaleY;
  const tickData = gameData.ticks[currentTick];
  const rc = mainRc();

  let hovered = null;
  for (const ent of tickData.entities) {
    if (ent.symbol === '-') continue;
    const pos = gameToCanvas(rc, ent.x, ent.y);
    const dist = Math.sqrt((cx - pos.x) ** 2 + (cy - pos.y) ** 2);
    const hitRadius = (SYMBOL_RADIUS[ent.symbol] || 8) + 4;

    // For buildings, use a larger hit area based on their tile size
    let checkRadius = hitRadius;
    if (ent.symbol === 'P') checkRadius = (3 * rc.cellSize) / 2;
    if (ent.symbol === 'R') checkRadius = (4 * rc.cellSize) / 2;

    if (dist < checkRadius) { hovered = ent; break; }
  }

  if (hovered) {
    const name = getEntityMeta(hovered).name;
    const teamStr = hovered.team === 0 ? 'Blue' : 'Red';
    const typeLabel = { ground: 'Ground', air: 'Air', building: 'Building', spell: 'Spell' }[getEntityType(hovered)];
    tooltipName.textContent = `${name} (${teamStr})`;
    tooltipStat.textContent = `${typeLabel} | HP: ${hovered.hp} | Pos: (${hovered.x.toFixed(1)}, ${hovered.y.toFixed(1)})`;
    tooltip.style.display = 'block';
    tooltip.style.left = (cx + 15) + 'px';
    tooltip.style.top = (cy - 10) + 'px';
  } else {
    tooltip.style.display = 'none';
  }
});

canvas.addEventListener('mouseleave', () => { tooltip.style.display = 'none'; });

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if (!gameData) return;
  if (e.code === 'Space') { e.preventDefault(); setPlaying(!playing); }
  if (e.code === 'ArrowRight') { e.preventDefault(); btnStepFwd.click(); }
  if (e.code === 'ArrowLeft') { e.preventDefault(); btnStepBack.click(); }
});

// ---------------------------------------------------------------------------
// Test surface.
//
// Everything above is declared with `let`/`const`/`function` at script top
// level, which in a classic script creates LEXICAL bindings that are NOT
// properties of `window` -- so none of it is reachable from the console or
// from a driving harness. This block is the deliberate, single place that
// exposes what the checks in docs/superpowers/plans/ need.
//
// Read-only by intent: `state()` returns a snapshot, not live references to
// mutate. Nothing here runs on load, so it cannot affect normal use.
// ---------------------------------------------------------------------------
window.__viewerTests = {
  getEntityMeta,
  buildSymbolIndex,
  formatMaxHp,
  symbolIndex: () => SYMBOL_INDEX,
  bridgeCells: () => BRIDGE_CELLS,
  riverRows: () => RIVER_ROWS,
  loadJson: (text, name) => loadFile(new File([text], name || 'test.json',
                                              { type: 'application/json' })),
  state: () => ({
    loaded: !!gameData,
    tick: currentTick,
    totalTicks: gameData ? gameData.ticks.length : 0,
    entities: gameData ? gameData.ticks[currentTick].entities.length : 0,
  }),
  entitiesAt: (i) => gameData ? gameData.ticks[i].entities : [],
  gotoTick: (i) => { currentTick = i; renderTick(); updateUI(); },
  cardMeta: () => CARD_META,
};
</script>
